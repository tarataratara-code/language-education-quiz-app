<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>アプリを更新</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
        background: #f7f9fb;
        color: #17202a;
        line-height: 1.7;
      }

      main {
        max-width: 680px;
        margin: 0 auto;
        display: grid;
        gap: 14px;
      }

      section {
        background: #fff;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        padding: 16px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
      }

      p {
        margin: 0 0 10px;
      }

      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border: 1px solid #2f7d6d;
        border-radius: 6px;
        padding: 0 14px;
        background: #2f7d6d;
        color: #fff;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      .muted {
        color: #697386;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>アプリを更新</h1>
        <p>学習履歴は残したまま、古いアプリ本体のキャッシュだけを削除します。</p>
        <p class="muted">「履歴リセット」は行いません。</p>
      </section>

      <section>
        <p id="status">下のボタンを押してください。</p>
        <button id="updateButton" type="button">アプリ本体を更新する</button>
      </section>
    </main>

    <script>
      async function updateApp() {
        const status = document.getElementById("status");
        status.textContent = "更新中です...";

        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }

          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }

          status.textContent = "更新できました。アプリを開き直します。";
          location.replace("./index.html?v=20260710-7");
        } catch {
          status.textContent = "自動更新できませんでした。Safari/Chromeで再読み込みしてください。";
        }
      }

      document.getElementById("updateButton").addEventListener("click", updateApp);
    </script>
  </body>
</html>
